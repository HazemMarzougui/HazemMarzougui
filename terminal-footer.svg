<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="fClip"><rect x="0" y="0" width="1000" height="140" rx="14" ry="14"/></clipPath>
    <style>
      .dim { fill: #6f6480; }
      .body { fill: #b8b0c4; }
      .accent { fill: #f0a35a; }
    </style>
  </defs>
  <g clip-path="url(#fClip)">
    <rect x="0" y="0" width="1000" height="140" fill="#181022"/>
    <g fill="#f0a35a" fill-opacity="0.3">
      <circle cx="70" cy="30" r="1.5"/><circle cx="130" cy="60" r="1.5"/>
      <circle cx="900" cy="35" r="1.5"/><circle cx="940" cy="80" r="1.5"/>
      <circle cx="50" cy="110" r="1.5"/>
    </g>
    <g stroke="#f0a35a" stroke-opacity="0.10" stroke-width="1">
      <line x1="70" y1="30" x2="130" y2="60"/>
      <line x1="900" y1="35" x2="940" y2="80"/>
    </g>
    <rect x="0" y="0" width="1000" height="36" fill="#241a33"/>
    <line x1="0" y1="36" x2="1000" y2="36" stroke="#332747" stroke-width="1"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
      <circle cx="24" cy="18" r="5.5" fill="#ff5f56"/>
      <circle cx="42" cy="18" r="5.5" fill="#ffbd2e"/>
      <circle cx="60" cy="18" r="5.5" fill="#27c93f"/>
    </g>
    <text x="500" y="23" text-anchor="middle" class="dim" font-size="12">&gt; hazem marzougui — zsh</text>

    <text x="50" y="70" class="accent" font-size="17">$ contact --open-to-work</text>
    <text x="50" y="98" class="body" font-size="14">Spinning up conversations about cloud, infra, and shipping things that stay up.</text>
    <text x="50" y="120" class="dim" font-size="13">$ echo "thanks for reading" &amp;&amp; exit 0<tspan fill="#f0a35a">_<animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>
  <rect x="0" y="0" width="1000" height="140" rx="14" ry="14" fill="none" stroke="#f0a35a" stroke-opacity="0.35" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
