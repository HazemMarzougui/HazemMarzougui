<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="c3"><rect x="0" y="0" width="1000" height="360" rx="14" ry="14"/></clipPath>
    <style>
      .dim{fill:#6f6480} .body{fill:#b8b0c4} .accent{fill:#f0a35a}
      .ok{fill:#7ee787} .warn{fill:#f0a35a}
    </style>
  </defs>
  <g clip-path="url(#c3)">
    <rect width="1000" height="360" fill="#181022"/>
    <rect x="0" y="0" width="1000" height="40" fill="#241a33"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#332747"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
      <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
      <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
      <circle cx="64" cy="20" r="6" fill="#27c93f"/>
    </g>
    <text x="500" y="25" text-anchor="middle" class="dim" font-size="13">&gt; kubectl get pods -n hazem-skills</text>

    <text x="45" y="78" class="accent" font-size="15">$ kubectl get pods -n hazem-skills</text>

    <g font-size="13.5" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="45"  y="108" class="dim">NAME</text>
      <text x="480" y="108" class="dim">READY</text>
      <text x="560" y="108" class="dim">STATUS</text>
      <text x="680" y="108" class="dim">RESTARTS</text>
      <text x="800" y="108" class="dim">AGE</text>

      <text x="45"  y="134" class="body">pod/turathai-platform</text>
      <text x="480" y="134" class="body">1/1</text>
      <text x="560" y="134" class="ok">Running</text>
      <text x="680" y="134" class="body">0</text>
      <text x="800" y="134" class="body">8mo</text>

      <text x="45"  y="160" class="body">pod/inventrack-pro</text>
      <text x="480" y="160" class="body">1/1</text>
      <text x="560" y="160" class="ok">Running</text>
      <text x="680" y="160" class="body">0</text>
      <text x="800" y="160" class="body">6mo</text>

      <text x="45"  y="186" class="body">pod/devops-internship</text>
      <text x="480" y="186" class="body">1/1</text>
      <text x="560" y="186" class="ok">Running</text>
      <text x="680" y="186" class="body">0</text>
      <text x="800" y="186" class="body">3mo</text>

      <text x="45"  y="212" class="body">pod/self-managed-k8s-cluster</text>
      <text x="480" y="212" class="body">1/1</text>
      <text x="560" y="212" class="ok">Running</text>
      <text x="680" y="212" class="body">0</text>
      <text x="800" y="212" class="body">2mo</text>

      <text x="45"  y="238" class="body">pod/aws-cloudops-cert</text>
      <text x="480" y="238" class="body">0/1</text>
      <text x="560" y="238" class="warn">Pending</text>
      <text x="680" y="238" class="body">0</text>
      <text x="800" y="238" class="body">14d</text>

      <text x="45"  y="264" class="body">pod/tapeat-connect</text>
      <text x="480" y="264" class="body">1/1</text>
      <text x="560" y="264" class="ok">Running</text>
      <text x="680" y="264" class="body">1</text>
      <text x="800" y="264" class="body">11mo</text>
    </g>

    <text x="45" y="302" class="accent" font-size="14">$ kubectl rollout status deployment/career --watch</text>
    <text x="45" y="324" class="dim" font-size="13">Waiting for deployment "career" rollout to finish: 5 of 6 pods ready...</text>
    <text x="45" y="345" class="body" font-size="13">deployment "career" successfully rolled out <tspan class="ok">✔</tspan><tspan fill="#f0a35a">_<animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></tspan></text>

    <rect x="0" y="0" width="1000" height="360" rx="14" ry="14" fill="none" stroke="#f0a35a" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
