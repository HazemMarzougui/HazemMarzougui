<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1000" height="300" rx="14" ry="14"/>
    </clipPath>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#f0a35a" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#1a1023" stop-opacity="0"/>
    </radialGradient>
    <style>
      .dim { fill: #6f6480; }
      .body { fill: #b8b0c4; }
      .accent { fill: #f0a35a; }
      .blue { fill: #7aa2d8; }
      .lav { fill: #b48ce0; }
      .bold { font-weight: 700; }
      .mono { letter-spacing: 0.2px; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1000" height="300" fill="#181022"/>
    <rect x="0" y="0" width="1000" height="300" fill="url(#glow)"/>

    <!-- constellation background -->
    <g stroke="#f0a35a" stroke-opacity="0.10" stroke-width="1">
      <line x1="60" y1="70" x2="150" y2="120"/>
      <line x1="150" y1="120" x2="120" y2="200"/>
      <line x1="150" y1="120" x2="260" y2="90"/>
      <line x1="700" y1="40" x2="780" y2="90"/>
      <line x1="780" y1="90" x2="860" y2="60"/>
      <line x1="780" y1="90" x2="820" y2="170"/>
      <line x1="900" y1="220" x2="960" y2="180"/>
      <line x1="820" y1="170" x2="900" y2="220"/>
      <line x1="40" y1="230" x2="110" y2="260"/>
    </g>
    <g fill="#f0a35a" fill-opacity="0.35">
      <circle cx="60" cy="70" r="1.6"/>
      <circle cx="150" cy="120" r="1.6"/>
      <circle cx="120" cy="200" r="1.6"/>
      <circle cx="260" cy="90" r="1.6"/>
      <circle cx="700" cy="40" r="1.6"/>
      <circle cx="780" cy="90" r="1.6"/>
      <circle cx="860" cy="60" r="1.6"/>
      <circle cx="820" cy="170" r="1.6"/>
      <circle cx="900" cy="220" r="1.6"/>
      <circle cx="960" cy="180" r="1.6"/>
      <circle cx="40" cy="230" r="1.6"/>
      <circle cx="110" cy="260" r="1.6"/>
    </g>

    <!-- title bar -->
    <rect x="0" y="0" width="1000" height="46" fill="#241a33"/>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#332747" stroke-width="1"/>
    <circle cx="28" cy="23" r="6.5" fill="#ff5f56"/>
    <circle cx="50" cy="23" r="6.5" fill="#ffbd2e"/>
    <circle cx="72" cy="23" r="6.5" fill="#27c93f"/>
    <text x="500" y="28" text-anchor="middle" class="dim" font-size="14">&gt; hazem marzougui — zsh</text>

    <!-- prompt block -->
    <text x="50" y="92" class="accent" font-size="19">$ whoami</text>
    <text x="50" y="140" class="accent bold mono" font-size="42">&gt; Hazem Marzougui</text>
    <text x="50" y="172" class="body" font-size="18">Cloud &amp; DevOps Engineer in training</text>
    <text x="50" y="197" class="dim" font-size="14">Final-year Cloud Computing @ ESPRIT · Intern @ LeadGen AI Platform</text>
    <text x="50" y="252" class="dim" font-size="15">$ status: multidisciplinary, self-deployed, open to work_</text>

    <!-- stack column -->
    <text x="640" y="80" class="dim" font-size="15">stack:</text>
    <text x="640" y="106" class="accent" font-size="15">aws, ec2, s3</text>
    <text x="640" y="130" class="blue" font-size="15">docker, kubernetes</text>
    <text x="640" y="154" class="lav" font-size="15">terraform, ansible</text>
    <text x="640" y="178" class="body" font-size="15">spring boot, angular</text>
    <text x="640" y="202" class="dim" font-size="15">java, php, mysql</text>

    <rect x="0" y="0" width="1000" height="300" rx="14" ry="14" fill="none" stroke="#f0a35a" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
</svg>
