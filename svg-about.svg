<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="c1"><rect x="0" y="0" width="1000" height="400" rx="14" ry="14"/></clipPath>
    <style>
      .dim{fill:#6f6480} .body{fill:#b8b0c4} .accent{fill:#f0a35a} .bold{font-weight:700}
    </style>
  </defs>
  <g clip-path="url(#c1)">
    <rect width="1000" height="400" fill="#181022"/>
    <g fill="#f0a35a" fill-opacity="0.3">
      <circle cx="920" cy="60" r="1.5"/><circle cx="960" cy="100" r="1.5"/><circle cx="880" cy="120" r="1.5"/>
      <circle cx="40" cy="340" r="1.5"/><circle cx="80" cy="370" r="1.5"/>
    </g>
    <g stroke="#f0a35a" stroke-opacity="0.10">
      <line x1="920" y1="60" x2="960" y2="100"/><line x1="960" y1="100" x2="880" y2="120"/>
      <line x1="40" y1="340" x2="80" y2="370"/>
    </g>

    <rect x="0" y="0" width="1000" height="40" fill="#241a33"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#332747"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
      <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
      <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
      <circle cx="64" cy="20" r="6" fill="#27c93f"/>
    </g>
    <text x="500" y="25" text-anchor="middle" class="dim" font-size="13">&gt; about.md — cat</text>

    <text x="45" y="80" class="accent" font-size="16">$ whoami</text>
    <text x="45" y="103" class="body" font-size="15">&gt; Hazem Marzougui — Cloud &amp; DevOps Engineer in training</text>

    <text x="45" y="140" class="accent" font-size="16">$ education --current</text>
    <text x="45" y="163" class="body" font-size="15">&gt; Final-year Cloud Computing student @ ESPRIT</text>

    <text x="45" y="200" class="accent" font-size="16">$ employment --current</text>
    <text x="45" y="223" class="body" font-size="15">&gt; DevOps / Cloud Engineer Intern @ LeadGen AI Platform</text>

    <text x="45" y="260" class="accent" font-size="16">$ preparing</text>
    <text x="45" y="283" class="body" font-size="15">&gt; AWS Certified CloudOps Engineer – Associate</text>

    <text x="45" y="320" class="accent" font-size="16">$ side_project --status running</text>
    <text x="45" y="343" class="body" font-size="15">&gt; Self-managed cloud-native infra, built from bare metal: controller /</text>
    <text x="45" y="363" class="body" font-size="15">  compute / storage nodes running Kubernetes-hosted VMs.</text>

    <text x="45" y="392" class="dim" font-size="14">$ status: multidisciplinary, self-deployed, open to work<tspan fill="#f0a35a">_<animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></tspan></text>

    <rect x="0" y="0" width="1000" height="400" rx="14" ry="14" fill="none" stroke="#f0a35a" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
