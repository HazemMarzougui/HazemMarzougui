      <rect x="444" y="116" width="104" height="24" rx="5" fill="#241a33" stroke="#b48ce0" stroke-opacity="0.5"/><text x="496" y="132" text-anchor="middle" class="lav">SonarQube</text>
      <rect x="554" y="116" width="92"  height="24" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/><text x="600" y="132" text-anchor="middle" class="blue">OWASP DC</text>
