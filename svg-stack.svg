      <rect x="786" y="262" width="112" height="24" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/><text x="842" y="278" text-anchor="middle" class="blue">PostgreSQL</text>
      <rect x="904" y="262" width="74"  height="24" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/><text x="941" y="278" text-anchor="middle" class="blue">MySQL</text>
      <rect x="700" y="296" width="66"  height="24" rx="5" fill="#241a33" stroke="#f0a35a" stroke-opacity="0.5"/><text x="733" y="312" text-anchor="middle" class="accent">Redis</text>
      <rect x="772" y="296" width="46"  height="24" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/><text x="795" y="312" text-anchor="middle" class="body">Git</text>
