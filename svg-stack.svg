      <rect x="380" y="296" width="74"  height="24" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/><text x="417" y="312" text-anchor="middle" class="blue">Jaeger</text>
      <rect x="460" y="296" width="66"  height="24" rx="5" fill="#241a33" stroke="#b48ce0" stroke-opacity="0.5"/><text x="493" y="312" text-anchor="middle" class="lav">Alloy</text>
    </g>

    <text x="700" y="252" class="head" font-size="14">Data &amp; Frontend</text>
    <g class="chiptxt">
