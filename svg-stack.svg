      <rect x="700" y="150" width="80"  height="24" rx="5" fill="#241a33" stroke="#f0a35a" stroke-opacity="0.5"/><text x="740" y="166" text-anchor="middle" class="accent">FastAPI</text>
      <rect x="786" y="150" width="80"  height="24" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/><text x="826" y="166" text-anchor="middle" class="body">Symfony</text>
      <rect x="872" y="150" width="80"  height="24" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/><text x="912" y="166" text-anchor="middle" class="body">Laravel</text>
      <rect x="700" y="184" width="46"  height="24" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/><text x="723" y="200" text-anchor="middle" class="body">PHP</text>
    </g>

