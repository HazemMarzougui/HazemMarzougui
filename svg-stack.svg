    <text x="45" y="392" class="dim" font-size="14">$ echo "24 tools, 1 favorite shell"<tspan fill="#f0a35a">_<animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></tspan></text>

    <rect x="0" y="0" width="1000" height="420" rx="14" ry="14" fill="none" stroke="#f0a35a" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
    </rect>
