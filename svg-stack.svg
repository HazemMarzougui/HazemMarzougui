<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="c2"><rect x="0" y="0" width="1000" height="320" rx="14" ry="14"/></clipPath>
    <style>
      .dim{fill:#6f6480} .body{fill:#b8b0c4} .accent{fill:#f0a35a} .blue{fill:#7aa2d8} .lav{fill:#b48ce0} .head{fill:#ffffff;font-weight:700}
      .chip{rx:5;ry:5;stroke-width:1}
    </style>
  </defs>
  <g clip-path="url(#c2)">
    <rect width="1000" height="320" fill="#181022"/>
    <rect x="0" y="0" width="1000" height="40" fill="#241a33"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#332747"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
      <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
      <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
      <circle cx="64" cy="20" r="6" fill="#27c93f"/>
    </g>
    <text x="500" y="25" text-anchor="middle" class="dim" font-size="13">&gt; stack --list</text>

    <text x="45" y="75" class="accent" font-size="16">$ stack --list --group category</text>

    <!-- column 1 -->
    <text x="45" y="112" class="head" font-size="15">Cloud &amp; DevOps</text>
    <rect x="45" y="126" width="66" height="26" rx="5" fill="#241a33" stroke="#f0a35a" stroke-opacity="0.5"/>
    <text x="78" y="143" text-anchor="middle" class="accent" font-size="12">AWS</text>
    <rect x="117" y="126" width="80" height="26" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/>
    <text x="157" y="143" text-anchor="middle" class="blue" font-size="12">Docker</text>
    <rect x="203" y="126" width="112" height="26" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/>
    <text x="259" y="143" text-anchor="middle" class="blue" font-size="12">Kubernetes</text>
    <rect x="45" y="160" width="104" height="26" rx="5" fill="#241a33" stroke="#b48ce0" stroke-opacity="0.5"/>
    <text x="97" y="177" text-anchor="middle" class="lav" font-size="12">Terraform</text>
    <rect x="155" y="160" width="90" height="26" rx="5" fill="#241a33" stroke="#b48ce0" stroke-opacity="0.5"/>
    <text x="200" y="177" text-anchor="middle" class="lav" font-size="12">Ansible</text>
    <rect x="45" y="194" width="80" height="26" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/>
    <text x="85" y="211" text-anchor="middle" class="body" font-size="12">Linux</text>

    <!-- column 2 -->
    <text x="380" y="112" class="head" font-size="15">Backend</text>
    <rect x="380" y="126" width="118" height="26" rx="5" fill="#241a33" stroke="#f0a35a" stroke-opacity="0.5"/>
    <text x="439" y="143" text-anchor="middle" class="accent" font-size="12">Spring Boot</text>
    <rect x="506" y="126" width="66" height="26" rx="5" fill="#241a33" stroke="#f0a35a" stroke-opacity="0.5"/>
    <text x="539" y="143" text-anchor="middle" class="accent" font-size="12">Java</text>
    <rect x="380" y="160" width="98" height="26" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/>
    <text x="429" y="177" text-anchor="middle" class="body" font-size="12">Symfony</text>
    <rect x="486" y="160" width="94" height="26" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/>
    <text x="533" y="177" text-anchor="middle" class="body" font-size="12">Laravel</text>
    <rect x="380" y="194" width="66" height="26" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/>
    <text x="413" y="211" text-anchor="middle" class="body" font-size="12">PHP</text>

    <!-- column 3 -->
    <text x="700" y="112" class="head" font-size="15">Frontend &amp; Data</text>
    <rect x="700" y="126" width="94" height="26" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/>
    <text x="747" y="143" text-anchor="middle" class="blue" font-size="12">Angular</text>
    <rect x="804" y="126" width="86" height="26" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/>
    <text x="847" y="143" text-anchor="middle" class="blue" font-size="12">MySQL</text>
    <rect x="700" y="160" width="60" height="26" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/>
    <text x="730" y="177" text-anchor="middle" class="body" font-size="12">Git</text>
    <rect x="770" y="160" width="80" height="26" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/>
    <text x="810" y="177" text-anchor="middle" class="body" font-size="12">JavaFX</text>
    <rect x="700" y="194" width="120" height="26" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/>
    <text x="760" y="211" text-anchor="middle" class="body" font-size="12">FlutterFlow</text>

    <text x="45" y="270" class="dim" font-size="14">$ echo "7 languages, 1 favorite shell"<tspan fill="#f0a35a">_<animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></tspan></text>

    <rect x="0" y="0" width="1000" height="320" rx="14" ry="14" fill="none" stroke="#f0a35a" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
