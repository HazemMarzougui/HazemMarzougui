      <rect x="97"  y="116" width="74"  height="24" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/><text x="134" y="132" text-anchor="middle" class="blue">Docker</text>
      <rect x="177" y="116" width="112" height="24" rx="5" fill="#241a33" stroke="#7aa2d8" stroke-opacity="0.5"/><text x="233" y="132" text-anchor="middle" class="blue">Kubernetes</text>
      <rect x="45"  y="150" width="104" height="24" rx="5" fill="#241a33" stroke="#b48ce0" stroke-opacity="0.5"/><text x="97"  y="166" text-anchor="middle" class="lav">Terraform</text>
      <rect x="155" y="150" width="80"  height="24" rx="5" fill="#241a33" stroke="#b48ce0" stroke-opacity="0.5"/><text x="195" y="166" text-anchor="middle" class="lav">Ansible</text>
      <rect x="241" y="150" width="66"  height="24" rx="5" fill="#241a33" stroke="#b8b0c4" stroke-opacity="0.4"/><text x="274" y="166" text-anchor="middle" class="body">Linux</text>
    </g>

