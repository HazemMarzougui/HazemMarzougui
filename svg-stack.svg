<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="c2"><rect x="0" y="0" width="1000" height="420" rx="14" ry="14"/></clipPath>
    <style>
      .dim{fill:#6f6480} .body{fill:#b8b0c4} .accent{fill:#f0a35a} .blue{fill:#7aa2d8} .lav{fill:#b48ce0} .head{fill:#ffffff;font-weight:700}
      .chiptxt{font-size:12px}
    </style>
  </defs>
  <g clip-path="url(#c2)">
