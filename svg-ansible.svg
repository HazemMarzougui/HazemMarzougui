<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="c6"><rect x="0" y="0" width="1000" height="340" rx="14" ry="14"/></clipPath>
    <style>
      .dim{fill:#6f6480} .body{fill:#b8b0c4} .accent{fill:#f0a35a} .ok{fill:#7ee787}
    </style>
  </defs>
  <g clip-path="url(#c6)">
    <rect width="1000" height="340" fill="#181022"/>
    <rect x="0" y="0" width="1000" height="40" fill="#241a33"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#332747"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
      <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
      <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
      <circle cx="64" cy="20" r="6" fill="#27c93f"/>
    </g>
    <text x="500" y="25" text-anchor="middle" class="dim" font-size="13">&gt; ansible-playbook milestones.yml</text>

    <text x="45" y="76" class="accent" font-size="15">PLAY [career] ****************************************************</text>

    <g font-size="13">
      <text x="45" y="108" class="body">TASK [Complete ESPRIT Cloud Computing coursework] ******</text>
      <text x="770" y="108" class="ok">changed</text>

      <text x="45" y="134" class="body">TASK [Ship TurathAI-Platform cloud-native infra] *******</text>
      <text x="770" y="134" class="ok">changed</text>

      <text x="45" y="160" class="body">TASK [Build InvenTrack-Pro w/ JWT &amp; RBAC security] *****</text>
      <text x="770" y="160" class="ok">changed</text>

      <text x="45" y="186" class="body">TASK [Sync TapEat-Connect across 3 platforms] **********</text>
      <text x="770" y="186" class="ok">changed</text>

      <text x="45" y="212" class="body">TASK [Begin AWS CloudOps Associate prep] ***************</text>
      <text x="770" y="212" class="accent">ok</text>

      <text x="45" y="238" class="body">TASK [Stand up self-managed bare-metal k8s cluster] ****</text>
      <text x="770" y="238" class="ok">changed</text>
    </g>

    <text x="45" y="272" class="accent" font-size="15">PLAY RECAP ***********************************************************</text>
    <text x="45" y="298" class="body" font-size="13.5">career : ok=2  changed=4  unreachable=0  failed=0<tspan fill="#f0a35a">_<animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></tspan></text>

    <rect x="0" y="0" width="1000" height="340" rx="14" ry="14" fill="none" stroke="#f0a35a" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
