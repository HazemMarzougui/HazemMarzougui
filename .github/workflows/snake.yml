name: Generate Palette Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake SVG Asset
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HazemMarzougui
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#F0A35A&color_dots=#1A1023,#25123E,#462354,#945281,#F0A35A

      - name: Push Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
