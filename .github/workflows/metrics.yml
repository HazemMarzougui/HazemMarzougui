name: metrics
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  terminal-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HazemMarzougui
          template: terminal
          filename: assets/metrics.terminal.svg
          committer_branch: main
          output_action: commit
          committer_message: "chore: update terminal metrics"

          config_output: svg
          config_display: large
          config_timezone: Africa/Tunis

          # -- terminal template theme --
          plugin_terminal_theme: ${{ vars.METRICS_TERMINAL_THEME || 'terminal_lord' }}
          plugin_terminal_colors: >-
            #1a1023,#241a33,#f0a35a,#b8b0c4,#7aa2d8,#b48ce0
          plugin_terminal_shell: bash
          plugin_terminal_user: hazem
          plugin_terminal_font: FiraCode
          plugin_terminal_font_size: 13

          # -- languages / topics --
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_details: percentage

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

          # -- contributors across own repos --
          plugin_contributors: yes
          plugin_contributors_repositories: |
            HazemMarzougui/TurathAI-Platform
            HazemMarzougui/InvenTrack-Pro
            HazemMarzougui/TapEat-Connect
            HazemMarzougui/Askify-Engine
            HazemMarzougui/HomeShare-Plus
            HazemMarzougui/Switchini-Ecommerce
          plugin_contributors_size_h: 30
          plugin_contributors_size_w: 30

          # -- habits / lines changed --
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_lines: yes

          # -- force the exact palette via metrics' CSS injection option --
          extras_css: |
            :root { --color-prettylights-syntax-comment: #6f6480; }
            body { background-color: #1a1023 !important; }
            .card, .terminal { background-color: #1a1023 !important; border-color: #f0a35a33 !important; }
            .text_accent, a, .icon { fill: #f0a35a !important; color: #f0a35a !important; }
            .text_small, .text_default { fill: #b8b0c4 !important; color: #b8b0c4 !important; }
